apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  DATABASE_URL: "postgres://{{ .Values.auth.username }}:{{ .Values.auth.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.auth.database }}?sslmode=disable"
