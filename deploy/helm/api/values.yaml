image:
  repository: ghcr.io/mohidev-tech/devsecops-platform-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 65532

networkPolicy:
  enabled: true

database:
  # Phase 1: api reads DATABASE_URL from a plaintext Kubernetes Secret.
  # Phase 2 (vault.enabled=true): vault-agent injects creds into the pod
  # filesystem and the env var is sourced from /vault/secrets/database-url.
  secretName: app-postgres
  secretKey: DATABASE_URL

vault:
  # Toggle Phase 2 secret-injection. When true:
  #   - serviceAccount.name = api  (matched by Vault auth role)
  #   - pod annotations request vault-agent injection of secret/app/db
  #   - DATABASE_URL is sourced from a file, not the K8s Secret
  enabled: false
  role: api
  secretPath: secret/data/app/db

serviceAccount:
  # When vault.enabled, the SA name MUST match the kubernetes auth binding.
  create: true
  name: api

serviceMonitor:
  # Creates a ServiceMonitor for Prometheus to scrape /metrics.
  # Requires the kube-prometheus-stack CRDs. Off by default so plain Helm
  # installs without monitoring still succeed.
  enabled: false
  interval: 15s

prometheusRule:
  enabled: false
